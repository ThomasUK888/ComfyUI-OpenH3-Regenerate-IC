[project]
name = "comfyui-openh3-regenerate-ic"
description = "ComfyUI nodes for NVIDIA's Open-H3-Regenerate-2K-IC: regenerate a MiniMax-H3 draft at 1080p, 2K or 4K while keeping its faces."
version = "0.3.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/ThomasUK888/ComfyUI-OpenH3-Regenerate-IC"

[tool.comfy]
PublisherId = "thomasuk888"
DisplayName = "Open-H3 Regenerate IC"
Icon = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -p no:cacheprovider"
